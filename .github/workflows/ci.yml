name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # ESLint sem as regras de formatação do Prettier (a formatação em massa é um item do backlog).
      - run: bun run lint:ci
      - run: bun run docs:check
      - run: bun run build
      # Depois do build, para os testes de "CSS compilado" (tests/unit/css-tokens.test.ts) rodarem de verdade.
      - run: bun test tests/unit
